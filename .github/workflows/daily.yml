name: Daily log

on:
  schedule:
    # Twice daily for reliability — one landing run is enough for the day
    - cron: "37 3 * * *"
    - cron: "37 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-log
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Append daily entry
        run: |
          echo "- $(date -u '+%Y-%m-%d %H:%M UTC') — automated heartbeat" >> log.md

      - name: Commit and push
        run: |
          git config user.name  "e2sy"
          git config user.email "335930424+e2sy@users.noreply.github.com"
          git add log.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore(automated): daily log entry $(date -u '+%Y-%m-%d')"
            git push
          fi
